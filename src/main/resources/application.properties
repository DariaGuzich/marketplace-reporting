spring.application.name=marketplace-reporting
server.port=${PORT:8082}

# Та же база PostgreSQL, что у API, но своя схема reporting
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}
# Каждое соединение работает в схеме reporting: таблицы events и hourly_stats ищутся там
spring.datasource.hikari.schema=reporting

# Flyway работает только со схемой reporting и ведёт там свою таблицу flyway_schema_history,
# отдельно от миграций API в схеме public
spring.flyway.schemas=reporting
spring.flyway.default-schema=reporting

# Почасовая агрегация: каждый час в :05 (UTC) считается предыдущий полный час.
# Формат Spring cron: секунды минуты часы день месяц день_недели
reporting.aggregation-cron=${AGGREGATION_CRON:0 5 * * * *}
